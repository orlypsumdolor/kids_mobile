org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=1024M
android.useAndroidX=true
android.enableJetifier=true

# Force consistent JVM targets (use JAVA_HOME / Android Studio JDK; do not hardcode OS-specific paths)
kotlin.jvm.target.validation.mode=warning
kotlin.compilerOptions.jvmTarget=17

# Suppress warnings for deprecated Kotlin APIs
kotlin.compilerOptions.suppressWarnings=true
android.suppressUnsupportedCompileSdk=34